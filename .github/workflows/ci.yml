name: Zero-Trust Security Test with Istio + OPA

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ISTIO_VERSION: "1.31.1"
  # Upstream: https://github.com/istio/istio/releases/download/1.31.1/istio-1.31.1-linux-amd64.tar.gz.sha256
  ISTIO_SHA256: "cb4af2e8a099acfc51368c1d15d4deab8321ae628554d4ee5c74f62ebe775857"
  GATEKEEPER_CHART_VERSION: "3.23.1"
  OPA_VERSION: "1.21.1"
  # Upstream: https://openpolicyagent.org/downloads/v1.21.1/opa_linux_amd64_static.sha256
  OPA_SHA256: "668506eb17a2eaa1fce6cc0d1f42ef85125d4ac5bda5fc74d1152d0c77145031"
  KIND_VERSION: "v0.33.0"
  # Upstream: https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64.sha256sum
  KIND_SHA256: "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d"
  KIND_NODE_IMAGE: "kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0"
  CONFTEST_VERSION: "0.71.1"
  # Upstream checksums.txt for conftest_0.71.1_Linux_x86_64.tar.gz
  CONFTEST_SHA256: "c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985"
  ACTIONLINT_VERSION: "1.7.12"
  # Upstream: actionlint_1.7.12_checksums.txt
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install OPA
        run: |
          # Do not write to ./opa — that path is the policy directory in this repo.
          curl -fsSL -o "${RUNNER_TEMP}/opa" \
            "https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_linux_amd64_static"
          echo "${OPA_SHA256}  ${RUNNER_TEMP}/opa" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/opa"
          sudo mv "${RUNNER_TEMP}/opa" /usr/local/bin/opa
          opa version

      - name: Run OPA unit tests with coverage gate
        run: opa test opa/ -v --coverage --threshold 90

      - name: Install Conftest
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/conftest.tar.gz" \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          echo "${CONFTEST_SHA256}  ${RUNNER_TEMP}/conftest.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/conftest.tar.gz" -C "${RUNNER_TEMP}" conftest
          sudo mv "${RUNNER_TEMP}/conftest" /usr/local/bin/conftest
          conftest --version

      - name: Conftest app manifests
        run: conftest test manifests/app/ -p policy/conftest

      - name: Conftest mesh policies (combine)
        run: |
          conftest test --combine \
            manifests/istio/peerauthentication.yaml \
            manifests/istio/authorizationpolicy-allow-nothing.yaml \
            manifests/istio/authorizationpolicy-allow-frontend-backend.yaml \
            manifests/istio/authorizationpolicy-allow-ingress-frontend.yaml \
            manifests/istio/authorizationpolicy-allow-backend-db.yaml \
            -p policy/conftest-mesh

      - name: Install actionlint
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/actionlint.tar.gz" -C "${RUNNER_TEMP}" actionlint
          sudo mv "${RUNNER_TEMP}/actionlint" /usr/local/bin/actionlint
          actionlint -version

      - name: Lint GitHub Actions workflows
        run: actionlint

      - name: Self-test HTTP probe classifiers
        run: bash scripts/test_http_probe_classify.sh

  zero-trust-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: lint-and-unit
    permissions:
      contents: read
      # Upload SECURITY-REPORT.md and manifests snapshot artifacts
      actions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: "v1.35.8"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "v3.19.0"

      - name: Install kind
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/kind" \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  ${RUNNER_TEMP}/kind" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/kind"
          sudo mv "${RUNNER_TEMP}/kind" /usr/local/bin/kind
          kind version

      - name: Create kind cluster
        run: |
          kind create cluster --config manifests/kind/cluster.yaml --image "${KIND_NODE_IMAGE}"
          kubectl get nodes -o wide

      - name: Install Istio with OPA extension provider
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/istio.tar.gz" \
            "https://github.com/istio/istio/releases/download/${ISTIO_VERSION}/istio-${ISTIO_VERSION}-linux-amd64.tar.gz"
          echo "${ISTIO_SHA256}  ${RUNNER_TEMP}/istio.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/istio.tar.gz" -C "${RUNNER_TEMP}"
          sudo mv "${RUNNER_TEMP}/istio-${ISTIO_VERSION}/bin/istioctl" /usr/local/bin/istioctl
          istioctl version --remote=false
          istioctl install -y -f manifests/istio-operator.yaml
          kubectl -n istio-system wait --for=condition=available --timeout=300s deployment/istiod

      - name: Deploy OPA-Envoy and application mesh policies
        run: |
          kubectl apply -f manifests/namespace.yaml
          kubectl apply -f manifests/istio/istio-injection-label.yaml
          kubectl create configmap opa-policy \
            --from-file=policy.rego=opa/policy.rego \
            --namespace istio-system \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f manifests/opa/deployment.yaml
          kubectl apply -f manifests/opa/config.yaml
          kubectl -n istio-system wait --for=condition=available --timeout=180s deployment/opa
          kubectl apply -f manifests/app/
          kubectl apply -f manifests/istio/
          kubectl apply -f manifests/opa/authorizationpolicy-ext-authz.yaml
          kubectl -n frontend wait --for=condition=available --timeout=300s deployment/frontend
          kubectl -n backend wait --for=condition=available --timeout=300s deployment/backend
          kubectl -n db wait --for=condition=available --timeout=300s deployment/db

      - name: Install OPA Gatekeeper
        run: |
          helm repo add gatekeeper https://open-policy-agent.github.io/gatekeeper/charts
          helm repo update
          helm upgrade --install gatekeeper gatekeeper/gatekeeper \
            --namespace gatekeeper-system \
            --create-namespace \
            --version "${GATEKEEPER_CHART_VERSION}" \
            --wait \
            --timeout 300s

      - name: Apply Gatekeeper policies
        run: |
          kubectl apply -f policies/templates/
          kubectl apply -f policies/constraints/
          # Wait until the constraint is visible to the admission webhook.
          for _ in $(seq 1 30); do
            if kubectl get k8srequiredlabels.constraints.gatekeeper.sh must-have-app-label >/dev/null 2>&1; then
              echo "Gatekeeper constraint ready"
              break
            fi
            sleep 2
          done
          kubectl get k8srequiredlabels.constraints.gatekeeper.sh must-have-app-label
          sleep 5

      - name: Assert positive and negative zero-trust controls
        run: bash scripts/test_policy.sh

      - name: Collect policy status
        if: always()
        run: |
          {
            echo "# SECURITY-REPORT.md"
            echo ""
            echo "## Istio AuthorizationPolicies"
            kubectl get authorizationpolicy -A -o yaml
            echo ""
            echo "## Istio PeerAuthentication"
            kubectl get peerauthentication -A -o yaml
            echo ""
            echo "## Istio Sidecar (egress)"
            kubectl get sidecar -A -o yaml
            echo ""
            echo "## OPA deployment"
            kubectl -n istio-system get deploy,svc,cm -l app=opa -o wide || true
            kubectl -n istio-system logs deploy/opa --tail=80 || true
            echo ""
            echo "## Gatekeeper constraints"
            kubectl get k8srequiredlabels.constraints.gatekeeper.sh -A -o yaml || \
              kubectl get constrainttemplate -A
          } > SECURITY-REPORT.md

      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zero-trust-security-report
          path: SECURITY-REPORT.md

      - name: Upload manifests snapshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-logs
          path: |
            manifests/
            policies/
            scripts/
            opa/

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name zero-trust
