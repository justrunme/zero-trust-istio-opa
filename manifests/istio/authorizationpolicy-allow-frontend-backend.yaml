apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-frontend-to-backend
  namespace: backend
spec:
  selector:
    matchLabels:
      app: backend
  action: ALLOW
  rules:
    # Frontend workload identity may call allowlisted methods.
    - from:
        - source:
            principals: ["cluster.local/ns/frontend/sa/frontend"]
      to:
        - operation:
            methods: ["GET", "HEAD"]
    # Exact healthz path for probes (still gated by OPA CUSTOM policy).
    - to:
        - operation:
            methods: ["GET"]
            paths: ["/healthz"]
