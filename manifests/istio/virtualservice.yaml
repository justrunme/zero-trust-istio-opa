apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: frontend
  namespace: frontend
spec:
  hosts:
    - "*"
  gateways:
    - bookinfo-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: frontend.frontend.svc.cluster.local
            port:
              number: 80
