# Reference OPA-Envoy plugin config (mirrored by Deployment args).
# Policy bundle is generated from opa/policy.rego via kustomize configMapGenerator.
apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-envoy-config
  namespace: istio-system
data:
  config.yaml: |
    plugins:
      envoy_ext_authz_grpc:
        addr: :9191
        path: istio/authz/allow
        dry-run: false
    decision_logs:
      console: true
