# IstioOperator used by deploy_all.sh / CI to enable OPA as an extension provider.
apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
spec:
  profile: demo
  meshConfig:
    accessLogFile: /dev/stdout
    extensionProviders:
      - name: opa-ext-authz
        envoyExtAuthzGrpc:
          service: opa.istio-system.svc.cluster.local
          port: 9191
