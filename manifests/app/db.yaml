apiVersion: v1
kind: ServiceAccount
metadata:
  name: db
  namespace: db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: db
  labels:
    app: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      serviceAccountName: db
      containers:
      - name: db
        # httpd so AuthorizationPolicy allow/deny can be asserted over HTTP.
        image: httpd:2.4.69
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: db
spec:
  selector:
    app: db
  ports:
  - port: 80
    targetPort: 80
